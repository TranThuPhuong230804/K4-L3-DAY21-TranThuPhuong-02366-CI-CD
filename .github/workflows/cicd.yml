name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          credentials_path = Path("sa-key.json").resolve()
          credentials_path.write_text(os.environ["STORAGE_CREDENTIALS"], encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"GOOGLE_APPLICATION_CREDENTIALS={credentials_path}\n")
          PY

      - name: Configure DVC Cloud Storage remote
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          dvc init --force
          dvc remote add --default --force --local labstore "gs://${ARTIFACT_BUCKET}/dvc"
          dvc remote modify --local labstore credentialpath "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json
          import os

          with open("outputs/report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
              github_output.write(f"f1={float(report['f1_score'])}\n")
          PY

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          retention-days: 7

      - name: Save model for gated release
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.joblib
          retention-days: 1

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check positive-class F1 threshold
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import os

          f1 = float(os.environ["F1_SCORE"])
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Deployment blocked.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Deployment may proceed.")
          PY

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: model-artifact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Cloud Storage client
        run: pip install google-cloud-storage==2.16.0

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          credentials_path = Path("sa-key.json").resolve()
          credentials_path.write_text(os.environ["STORAGE_CREDENTIALS"], encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"GOOGLE_APPLICATION_CREDENTIALS={credentials_path}\n")
          PY

      - name: Promote quality-approved model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PY'
          import os
          from google.cloud import storage

          bucket = storage.Client().bucket(os.environ["ARTIFACT_BUCKET"])
          blob = bucket.blob("artifacts/current/model.joblib")
          blob.upload_from_filename("model-artifact/model.joblib")
          print(f"Uploaded gs://{bucket.name}/{blob.name}")
          PY

      - name: Restart service and verify health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            attempt=1
            while [ "$attempt" -le 12 ]; do
              if curl --fail --silent --show-error http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              echo "Health check attempt $attempt failed; retrying..."
              sleep 5
              attempt=$((attempt + 1))
            done
            sudo journalctl -u income-api --no-pager -n 50 || true
            exit 1
